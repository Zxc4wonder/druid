name: Publish Druid Package

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Java and Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify Maven coordinates
        shell: bash
        run: |
          set -euo pipefail

          GROUP_ID="$(
            mvn -pl core help:evaluate \
              -Dexpression=project.groupId \
              -q \
              -DforceStdout
          )"

          ARTIFACT_ID="$(
            mvn -pl core help:evaluate \
              -Dexpression=project.artifactId \
              -q \
              -DforceStdout
          )"

          VERSION="$(
            mvn -pl core help:evaluate \
              -Dexpression=project.version \
              -q \
              -DforceStdout
          )"

          echo "Publishing: ${GROUP_ID}:${ARTIFACT_ID}:${VERSION}"

          test "${GROUP_ID}" = "com.jumpserver"
          test "${ARTIFACT_ID}" = "druid"
          test "${VERSION}" = "1.2.28-jms.1"

      - name: Publish package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn \
            --batch-mode \
            --no-transfer-progress \
            -pl core \
            -am \
            clean deploy \
            -DskipTests \
            -Dcheckstyle.skip=true \
            -Dgpg.skip=true